name: Update public note RSS cache
on:
  schedule:
    - cron: '17 18 * * *' # Every day 03:17 JST (UTC+9); GitHub may delay schedules.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-note-rss
  cancel-in-progress: false
jobs:
  update:
    # Public repositories use free standard GitHub-hosted runners.
    # Private repositories are intentionally excluded to avoid metered minutes.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public RSS and preserve previous successful cache
        run: python3 scripts/update_notes.py
      - name: Test updater and rendering
        run: python3 -m unittest discover -s tests -v
      - name: Commit only cached data without triggering Netlify deploys
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/notes.json public/data/notes.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update note RSS cache [skip ci] [skip netlify]'
            git push
          fi
